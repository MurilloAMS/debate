<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial;
      color: white;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      background: black;
      text-align: center;
      z-index: 10;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: 50vh;
      object-fit: cover;
      background: black;
    }
  </style>
</head>

<body>

<div class="top-bar">
  🔴 AO VIVO
</div>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script type="module">

import { Room, createLocalVideoTrack, createLocalAudioTrack } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Você precisa estar logado");
    location.href = "/login.html";
    return;
  }

  try {
    const params = new URLSearchParams(location.search);
    const roomName = params.get('room') || 'sala1';

    console.log("Entrando na sala:", roomName);

    const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
    const data = await res.json();

    if (!data.token || !data.url) {
      throw new Error("Token inválido");
    }

    const room = new Room();

    await room.connect(data.url, data.token);

    console.log("✅ Conectado ao LiveKit!");

    // ===================== 🎥 CAMERA CORRETA =====================
    const videoTrack = await createLocalVideoTrack();
    const audioTrack = await createLocalAudioTrack();

    // Mostrar vídeo local
    videoTrack.attach(document.getElementById('localVideo'));

    // Publicar no LiveKit
    await room.localParticipant.publishTrack(videoTrack);
    await room.localParticipant.publishTrack(audioTrack);

    console.log("🎥 Câmera e áudio publicados");

    // ===================== 👥 RECEBER OUTROS =====================
    room.on('trackSubscribed', (track, publication, participant) => {
      console.log("📡 Recebendo vídeo de:", participant.identity);

      if (track.kind === 'video') {
        track.attach(document.getElementById('remoteVideo'));
      }
    });

  } catch (err) {
    console.error("❌ ERRO REAL:", err);
    alert("Erro ao conectar na live: " + err.message);
  }
});

</script>

</body>
</html>
