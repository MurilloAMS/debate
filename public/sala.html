<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<link rel="icon" href="data:,">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

video {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.side-actions {
  position: fixed;
  right: 10px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  z-index: 10;
}

.action {
  text-align: center;
  color: white;
  font-size: 14px;
}

.action button {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.comments {
  position: fixed;
  bottom: 80px;
  left: 10px;
  width: 70%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 10;
}

.comment {
  background: rgba(0,0,0,0.4);
  padding: 6px 10px;
  border-radius: 10px;
  color: white;
  font-size: 14px;
  animation: subir 6s linear forwards;
}

@keyframes subir {
  0% { transform: translateY(20px); opacity: 1; }
  100% { transform: translateY(-120px); opacity: 0; }
}

.chat-input {
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
  z-index: 10;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

.chat-input button {
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  background: red;
  color: white;
}

/* 🔊 BOTÃO SOM */
#audioBtn {
  position: fixed;
  bottom: 60px;
  left: 10px;
  z-index: 20;
  background: red;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay muted playsinline style="width:120px;height:160px;position:fixed;top:60px;right:10px;border-radius:10px;"></video>

<button id="audioBtn">🔊 Ativar som</button>

<div class="side-actions">
  <div class="action">
    <button id="likeBtn">❤️</button>
    <div id="likeCount">0</div>
  </div>

  <div class="action">
    <button>💬</button>
  </div>

  <div class="action">
    <button id="shareBtn">🔗</button>
  </div>
</div>

<div class="comments" id="comments"></div>

<div class="chat-input">
  <input id="msg" placeholder="Comente..." />
  <button id="send">Enviar</button>
</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged, db } from '/firebase.js';
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let ws;
let room;
let username = "Usuário";

function addComment(text) {
  const el = document.createElement('div');
  el.className = 'comment';
  el.textContent = text;
  document.getElementById('comments').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "/login.html";

  // 🔥 BUSCAR NOME REAL
  try {
    const snap = await getDoc(doc(db, "usuarios", user.uid));
    if (snap.exists()) {
      username = snap.data().nome || user.email;
    } else {
      username = user.email;
    }
  } catch {
    username = user.email;
  }

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room') || 'sala1';

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'join',
      room: roomName,
      userId: user.uid,
      username: username
    }));
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === 'message') {
      addComment(`${msg.username}: ${msg.text}`);
    }

    if (msg.type === 'like-update') {
      document.getElementById('likeCount').textContent = msg.likes;
    }
  };

  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
  const data = await res.json();

  room = new Room();
  await room.connect(data.url, data.token);

  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById('localVideo').srcObject = stream;

  for (const track of stream.getTracks()) {
    await room.localParticipant.publishTrack(track);
  }

  room.on('trackSubscribed', (track) => {
    if (track.kind === 'video') {
      const stream = new MediaStream([track.mediaStreamTrack]);
      document.getElementById('remoteVideo').srcObject = stream;
    }
  });

  document.getElementById('send').onclick = () => {
    const input = document.getElementById('msg');
    if (!input.value) return;

    ws.send(JSON.stringify({
      type: 'message',
      text: input.value
    }));

    input.value = '';
  };

  document.getElementById('likeBtn').onclick = () => {
    ws.send(JSON.stringify({ type: 'like' }));
  };

  document.getElementById('shareBtn').onclick = () => {
    navigator.clipboard.writeText(window.location.href);
    alert("Link copiado!");
  };
});

// 🔊 ATIVAR SOM
document.getElementById('audioBtn').onclick = () => {
  document.querySelectorAll('video').forEach(v => {
    v.muted = false;
    v.play().catch(()=>{});
  });
};
</script>

</body>
</html>
