<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<link rel="icon" href="data:,">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

#videoGrid {
  position: fixed;
  inset: 0;
  display: grid;
  z-index: 1;
}

.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.side-actions {
  position: absolute;
  right: 12px;
  bottom: 110px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
  pointer-events: auto;
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.action button {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  color: white;
  font-size: 24px;
}

.action span {
  font-size: 12px;
  color: #ddd;
}

.hearts {
  position: absolute;
  right: 20px;
  bottom: 150px;
}

.heart {
  position: absolute;
  color: red;
  animation: floatUp 2s linear forwards;
}

@keyframes floatUp {
  100% { transform: translateY(-200px); opacity: 0; }
}

.comments {
  position: absolute;
  bottom: 80px;
  left: 10px;
  width: 70%;
}

.comment {
  background: rgba(0,0,0,0.5);
  padding: 6px;
  border-radius: 10px;
  margin-top: 5px;
  color: white;
}

.chat-input {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

.chat-input button {
  padding: 10px;
  border-radius: 20px;
  background: red;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div id="videoGrid"></div>

<div class="ui">

  <div class="side-actions">

    <div class="action">
      <button id="likeBtn">❤️</button>
      <span id="likeCount">0</span>
    </div>

    <div class="action">
      <button id="joinBtn">🙋</button>
      <span>Participar</span>
    </div>

    <div class="action">
      <button id="approveBtn" style="display:none;">➕</button>
      <span>Convidar</span>
    </div>

  </div>

  <div class="hearts" id="hearts"></div>
  <div class="comments" id="comments"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Comente..." />
    <button id="send">Enviar</button>
  </div>

</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

const videoGrid = document.getElementById('videoGrid');
const likeBtn = document.getElementById('likeBtn');
const likeCount = document.getElementById('likeCount');
const joinBtn = document.getElementById('joinBtn');
const approveBtn = document.getElementById('approveBtn');
const send = document.getElementById('send');
const msg = document.getElementById('msg');
const comments = document.getElementById('comments');
const hearts = document.getElementById('hearts');

let room;
let ws;
let pendingRequests = {};
const videos = {};

function addVideo(id, stream, isLocal=false) {
  if (videos[id]) return;

  const box = document.createElement('div');
  const video = document.createElement('video');

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  if (isLocal) video.muted = true;

  box.appendChild(video);
  videoGrid.appendChild(box);

  videos[id] = video;
}

function addComment(user, text) {
  const el = document.createElement('div');
  el.className = 'comment';
  el.innerHTML = `<strong>${user}</strong>: ${text}`;
  comments.appendChild(el);
  setTimeout(()=>el.remove(),5000);
}

function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'heart';
  h.innerText = '❤️';
  h.style.left = Math.random()*20+'px';
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),2000);
}

onAuthStateChanged(auth, async (user)=>{
  if(!user) return location.href="/login.html";

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room');
  const role = params.get('role') || 'audience';

  // WS
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen=()=>{
    ws.send(JSON.stringify({
      type:'join',
      room:roomName,
      userId:user.uid,
      username:user.email,
      role
    }));
  };

  ws.onmessage=(e)=>{
    let m;
    try{m=JSON.parse(e.data)}catch{return}

    if(m.type==='message') addComment(m.username,m.text);
    if(m.type==='like-update'){likeCount.textContent=m.likes;spawnHeart();}

    if(m.type==='join-request' && role==='host'){
      pendingRequests[m.userId]=true;
    }

    if(m.type==='approved' && m.userId===user.uid){
      startCamera();
    }
  };

  // LIVEKIT
  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
  const data = await res.json();

  room = new Room();
  await room.connect(data.url,data.token);

  room.on('trackSubscribed',(track,_,participant)=>{
    if(track.kind==='video'){
      addVideo(participant.identity,new MediaStream([track.mediaStreamTrack]));
    }
    if(track.kind==='audio'){
      const audio = document.createElement('audio');
      audio.srcObject=new MediaStream([track.mediaStreamTrack]);
      audio.autoplay=true;
    }
  });

  if(role==='host'){
    approveBtn.style.display='block';
    startCamera();
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    addVideo('self',stream,true);

    for(const track of stream.getTracks()){
      await room.localParticipant.publishTrack(track);
    }
  }

  likeBtn.onclick=()=>ws.send(JSON.stringify({type:'like'}));
  send.onclick=()=>{
    if(!msg.value) return;
    ws.send(JSON.stringify({type:'message',text:msg.value}));
    msg.value='';
  };

  joinBtn.onclick=()=>{
    ws.send(JSON.stringify({type:'join-request',userId:user.uid}));
  };

  approveBtn.onclick=()=>{
    const id=Object.keys(pendingRequests)[0];
    if(!id) return;
    delete pendingRequests[id];
    ws.send(JSON.stringify({type:'approve-user',userId:id}));
  };

});
</script>
</body>
</html>
