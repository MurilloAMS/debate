<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<style>
body { margin:0; background:black; font-family:Arial; overflow:hidden; }

/* 🎥 GRID */
#videoGrid {
  position: fixed;
  inset: 0;
  display: grid;
}

.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ❤️ CORAÇÃO GIGANTE */
#bigHeart {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 100px;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
}

.bigHeartShow {
  animation: bigHeartAnim 0.6s ease;
}

@keyframes bigHeartAnim {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* UI */
.ui {
  position: fixed;
  inset: 0;
  z-index: 10;
}

/* 🔥 BOTÕES */
.side-actions {
  position: absolute;
  right: 12px;
  bottom: 120px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  align-items: center;
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.action button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  color: white;
  font-size: 26px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.action button:active {
  transform: scale(0.85);
}

.liked {
  color: red !important;
  transform: scale(1.1);
}

.action span {
  font-size: 12px;
  color: #ddd;
}

/* ❤️ CORAÇÕES */
.hearts {
  position: absolute;
  right: 20px;
  bottom: 160px;
  pointer-events: none;
}

.heart {
  position: absolute;
  font-size: 22px;
  animation: floatUp 1.8s ease-out forwards;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-200px) scale(1.6); opacity: 0; }
}

/* CHAT */
.chat-input {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

.chat-input button {
  background: red;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div id="videoGrid"></div>
<div id="bigHeart">❤️</div>

<div class="ui">

  <div class="side-actions">

    <div class="action">
      <button id="likeBtn">❤️</button>
      <span id="likeCount">0</span>
    </div>

    <div class="action">
      <button id="joinBtn">🙋</button>
      <span>Participar</span>
    </div>

    <div class="action">
      <button id="approveBtn" style="display:none;">➕</button>
      <span>Convidar</span>
    </div>

  </div>

  <div class="hearts" id="hearts"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Comente..." />
    <button id="send">Enviar</button>
  </div>

</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let room;
let ws;
let pendingRequests = [];

const videoGrid = document.getElementById('videoGrid');
const likeBtn = document.getElementById('likeBtn');
const likeCount = document.getElementById('likeCount');
const hearts = document.getElementById('hearts');

let videos = {};

// 🎥 adicionar vídeo
function addVideo(id, stream, isLocal = false) {
  if (videos[id]) return;

  const box = document.createElement('div');
  box.className = 'video-box';

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  if (isLocal) video.muted = true;

  box.appendChild(video);
  videoGrid.appendChild(box);

  videos[id] = true;
}

// ❤️ coração pequeno
function spawnHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '❤️';
  heart.style.left = Math.random() * 20 + 'px';

  hearts.appendChild(heart);
  setTimeout(() => heart.remove(), 1800);
}

// ❤️ EXPLOSÃO COMPLETA
function triggerLikeExplosion() {

  ws.send(JSON.stringify({ type: 'like' }));

  likeBtn.classList.add('liked');

  if (navigator.vibrate) navigator.vibrate(50);

  const bigHeart = document.getElementById('bigHeart');
  bigHeart.classList.add('bigHeartShow');

  setTimeout(() => bigHeart.classList.remove('bigHeartShow'), 600);

  for (let i = 0; i < 8; i++) spawnHeart();

  setTimeout(() => likeBtn.classList.remove('liked'), 400);
}

// 🎥 TRACKS
function handleTrack(track, participant, user) {

  if (track.kind === 'video') {
    const stream = new MediaStream([track.mediaStreamTrack]);
    addVideo(participant.identity + track.sid, stream);
  }

  if (track.kind === 'audio') {
    const audio = document.createElement('audio');
    audio.srcObject = new MediaStream([track.mediaStreamTrack]);
    audio.autoplay = true;
    if (participant.identity === user.uid) audio.muted = true;
    audio.play().catch(()=>{});
  }
}

onAuthStateChanged(auth, async (user) => {

  if (!user) return location.href = "/login.html";

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room');
  const role = params.get('role') || 'audience';

  // WS
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'join',
      room: roomName,
      userId: user.uid,
      username: user.uid,
      role
    }));
  };

  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }

    if (data.type === 'like-update') {
      likeCount.textContent = data.likes;
      spawnHeart();
    }

    if (data.type === 'approved' && data.userId === user.uid) {
      startPublishing();
    }
  };

  // LIVEKIT
  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}&role=${role}`);
  const tk = await res.json();

  room = new Room();
  await room.connect(tk.url, tk.token);

  room.on('trackSubscribed', (track, pub, participant) => {
    handleTrack(track, participant, user);
  });

  room.remoteParticipants.forEach(participant => {
    participant.trackPublications.forEach(pub => {
      if (pub.track) handleTrack(pub.track, participant, user);
    });
  });

  if (role === 'host') {
    document.getElementById('approveBtn').style.display = 'block';
    await startPublishing();
  }

  async function startPublishing() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    addVideo("self", stream, true);

    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }
  }

  // ❤️ botão
  likeBtn.onclick = triggerLikeExplosion;

});

// 🔥 DOUBLE TAP
let lastTap = 0;

videoGrid.addEventListener('touchend', () => {
  const now = Date.now();

  if (now - lastTap < 300) {
    triggerLikeExplosion();
  }

  lastTap = now;
});

// 🔥 liberar áudio
document.body.addEventListener('click', () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
}, { once: true });

</script>

</body>
</html>
