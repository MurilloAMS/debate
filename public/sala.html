<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial;
      color: white;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      background: black;
      text-align: center;
      z-index: 10;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: 50vh;
      object-fit: cover;
      background: black;
    }
  </style>
</head>

<body>

<div class="top-bar">
  🔴 AO VIVO
</div>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script type="module">

// 🔥 IMPORTAÇÃO CORRETA (SEM CDN GLOBAL)
import { Room } from 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs';
import { auth, onAuthStateChanged } from '/firebase.js';

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Você precisa estar logado");
    location.href = "/login.html";
    return;
  }

  try {
    const params = new URLSearchParams(location.search);
    const roomName = params.get('room') || 'sala1';

    console.log("Entrando na sala:", roomName);

    // 🔥 TOKEN DO SERVER
    const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
    const data = await res.json();

    if (!data.token || !data.url) {
      throw new Error("Token inválido");
    }

    // 🔥 LIVEKIT
    const room = new Room();

    await room.connect(data.url, data.token);

    console.log("✅ Conectado!");

    // 🔥 CAMERA
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    document.getElementById('localVideo').srcObject = stream;

    // 🔥 PUBLICAR
    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }

    // 🔥 RECEBER OUTROS
    room.on('trackSubscribed', (track) => {
      if (track.kind === 'video') {
        const mediaStream = new MediaStream([track.mediaStreamTrack]);
        document.getElementById('remoteVideo').srcObject = mediaStream;
      }
    });

  } catch (err) {
    console.error("❌ ERRO:", err);
    alert("Erro ao conectar na live");
  }
});

</script>

</body>
</html>
