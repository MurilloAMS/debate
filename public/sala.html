<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <!-- ✅ LIVEKIT CORRETO -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial, sans-serif;
      color: white;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      background: black;
      text-align: center;
      z-index: 10;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: 50vh;
      object-fit: cover;
      background: black;
    }
  </style>
</head>

<body>

<div class="top-bar">
  🔴 AO VIVO
</div>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  try {
    // 🔥 VERIFICA SE LIVEKIT CARREGOU
    if (!window.LiveKit) {
      throw new Error("LiveKit não carregou");
    }

    const { auth, onAuthStateChanged } = await import('/firebase.js');

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        alert("Você precisa estar logado");
        location.href = "/login.html";
        return;
      }

      const params = new URLSearchParams(location.search);
      const roomName = params.get('room') || 'sala1';

      console.log("Entrando na sala:", roomName);

      // 🔥 BUSCA TOKEN
      const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);

      if (!res.ok) {
        throw new Error("Erro ao buscar token");
      }

      const data = await res.json();

      if (!data.token || !data.url) {
        throw new Error("Token inválido");
      }

      // ✅ USO CORRETO
      const room = new LiveKit.Room();

      await room.connect(data.url, data.token);

      console.log("✅ Conectado ao LiveKit");

      // 🔥 CAPTURA CÂMERA
      const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

      document.getElementById('localVideo').srcObject = stream;

      // 🔥 PUBLICA TRACKS
      for (const track of stream.getTracks()) {
        await room.localParticipant.publishTrack(track);
      }

      // 🔥 RECEBE OUTROS
      room.on('trackSubscribed', (track) => {
        if (track.kind === 'video') {
          const mediaStream = new MediaStream([track.mediaStreamTrack]);
          document.getElementById('remoteVideo').srcObject = mediaStream;
        }
      });

    });

  } catch (err) {
    console.error("❌ ERRO:", err);
    alert("Erro ao conectar na live: " + err.message);
  }

});
</script>

</body>
</html>
