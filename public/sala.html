<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <style>
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-200px); opacity: 0; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0f14;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      z-index: 1000;
    }

    .title { font-weight: bold; color: red; }
    .status { font-size: 12px; opacity: 0.7; }

    .video-area {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    video {
      width: 100%;
      height: 50%;
      object-fit: cover;
      background: black;
    }

    .overlay {
      position: absolute;
      bottom: 90px;
      left: 15px;
      z-index: 10;
    }

    .btn-request {
      position: absolute;
      bottom: 20px;
      left: 15px;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: red;
      color: white;
      font-weight: bold;
      cursor: pointer;
      z-index: 20;
    }

    .chat {
      position: absolute;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 10px;
      font-size: 13px;
    }

    #chatForm {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    #chatInput {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: white;
    }

    #chatForm button {
      padding: 10px;
      border: none;
      background: red;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .chat {
        width: 100%;
        height: 40%;
        bottom: 0;
        top: auto;
      }

      video { height: 50%; }
    }
  </style>
</head>

<body>

  <!-- TOPO -->
  <div class="top-bar">
    <div class="title">🔴 AO VIVO</div>
    <div id="status" class="status">Conectando...</div>
  </div>

  <!-- CONTROLES -->
  <div style="position:fixed; right:10px; bottom:100px;">
    <button id="likeBtn">❤️</button>
    <div id="likesCount">0</div>
    <button id="reportBtn">🚨</button>
  </div>

  <!-- VÍDEO -->
  <div class="video-area">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>

    <div class="overlay">
      <h3 id="roomName">Sala</h3>
      <p id="hostName">Host</p>
    </div>

    <button id="btnRequest" class="btn-request">
      Pedir para entrar 🎤
    </button>

    <div class="chat">
      <ul id="chatMessages"></ul>

      <form id="chatForm">
        <input id="chatInput" placeholder="Comente..." />
        <button>Enviar</button>
      </form>
    </div>
  </div>

  <!-- 🔥 PROTEÇÃO LOGIN -->
  <script type="module">
    import { auth, onAuthStateChanged } from '/firebase.js';

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          window.location.href = 'login.html';
        }
      });
    });
  </script>

  <!-- 🔥 SISTEMA DE STREAM -->
 <script type="module" src="/client.js"></script>

  <!-- 🔥 CONFIG DA SALA -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const room = params.get('room') || 'Sala';

      document.getElementById('roomName').textContent = room;
    });
  </script>

</body>
</html>
