<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<link rel="icon" href="data:,">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

/* 🔥 GRID */
#videoGrid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: grid;
  z-index: 1;
}

/* 🎥 VIDEO */
.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🔥 UI POR CIMA (SEM PRECISAR CLICAR) */
.ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* 🔥 BOTÕES LATERAIS */
.side-actions {
  position: absolute;
  right: 10px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  pointer-events: auto;
}

.action button {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  color: white;
  font-size: 20px;
}

/* 💬 COMENTÁRIOS */
.comments {
  position: absolute;
  bottom: 80px;
  left: 10px;
  width: 70%;
  pointer-events: none;
}

.comment {
  background: rgba(0,0,0,0.4);
  padding: 6px 10px;
  border-radius: 10px;
  margin-top: 5px;
  animation: subir 6s linear forwards;
  color: white;
}

@keyframes subir {
  0% { transform: translateY(20px); }
  100% { transform: translateY(-120px); opacity: 0; }
}

/* INPUT */
.chat-input {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

.chat-input button {
  padding: 10px;
  border-radius: 20px;
  background: red;
  border: none;
  color: white;
}
</style>
</head>

<body>

<!-- 🎥 VIDEOS -->
<div id="videoGrid"></div>

<!-- 🔥 UI -->
<div class="ui">

  <div class="side-actions">
    <button id="likeBtn">❤️</button>
    <div id="likeCount">0</div>

    <button id="joinBtn">🙋</button>

    <button id="approveBtn" style="display:none;">➕</button>
  </div>

  <div class="comments" id="comments"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Comente..." />
    <button id="send">Enviar</button>
  </div>

</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let room;
let ws;
let pendingRequests = [];

const videoGrid = document.getElementById('videoGrid');
const videos = {};

// 🔥 LAYOUT
function updateLayout() {
  const total = Object.keys(videos).length;

  if (total <= 1) {
    videoGrid.style.gridTemplateColumns = "1fr";
  } else {
    videoGrid.style.gridTemplateColumns = "1fr 1fr";
  }
}

// 🎥 ADD VIDEO
function addVideo(id, stream, isLocal = false) {
  if (videos[id]) return;

  const box = document.createElement('div');
  box.className = 'video-box';

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  // 🔥 CORREÇÃO DO ECO
  if (isLocal) video.muted = true;

  box.appendChild(video);
  videoGrid.appendChild(box);

  videos[id] = box;

  video.play().catch(()=>{});
  updateLayout();
}

// 💬
function addComment(text) {
  const el = document.createElement('div');
  el.className = 'comment';
  el.textContent = text;
  comments.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "/login.html";

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room');
  const role = params.get('role') || 'audience';

  // 🔥 WS
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'join',
      room: roomName,
      userId: user.uid,
      username: user.email,
      role
    }));
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === 'message') addComment(msg.username + ": " + msg.text);
    if (msg.type === 'like-update') likeCount.textContent = msg.likes;

    if (msg.type === 'join-request' && role === 'host') {
      pendingRequests.push(msg.userId);
      alert("Pedido para entrar");
    }

    if (msg.type === 'approved' && msg.userId === user.uid) {
      startPublishing();
    }
  };

  // 🔥 LIVEKIT
  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
  const data = await res.json();

  room = new Room();
  await room.connect(data.url, data.token);

  room.on('trackSubscribed', (track, pub, participant) => {
    if (track.kind === 'video') {
      const stream = new MediaStream([track.mediaStreamTrack]);
      addVideo(participant.identity, stream);
    }
  });

  // 👑 HOST
  if (role === 'host') {
    approveBtn.style.display = 'block';
    await startPublishing();
  }

  // 🎥 PUBLICAR
  async function startPublishing() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    addVideo("self", stream, true);

    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }
  }

  // ❤️
  likeBtn.onclick = () => {
    ws.send(JSON.stringify({ type: 'like' }));
  };

  // 💬
  send.onclick = () => {
    if (!msg.value) return;

    ws.send(JSON.stringify({
      type: 'message',
      text: msg.value
    }));

    msg.value = '';
  };

  // 🙋
  joinBtn.onclick = () => {
    ws.send(JSON.stringify({ type: 'join-request', userId: user.uid }));
  };

  // 👑
  approveBtn.onclick = () => {
    const userId = pendingRequests.shift();
    if (!userId) return;

    ws.send(JSON.stringify({
      type: 'approve-user',
      userId
    }));
  };

});
</script>

</body>
</html>
