<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<link rel="icon" href="data:,">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

/* 🎥 GRID */
#videoGrid {
  position: fixed;
  inset: 0;
  display: grid;
  z-index: 1;
}

/* 🎥 VIDEO */
.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🔥 UI */
.ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* 🔥 BOTÕES */
.side-actions {
  position: absolute;
  right: 12px;
  bottom: 110px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
  pointer-events: auto;
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.action button {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.action button:active {
  transform: scale(0.9);
}

.action span {
  font-size: 12px;
  color: #ddd;
}

/* ❤️ CORAÇÕES */
.hearts {
  position: absolute;
  right: 20px;
  bottom: 150px;
  pointer-events: none;
}

.heart {
  position: absolute;
  color: red;
  font-size: 20px;
  animation: floatUp 2s linear forwards;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
}

/* 💬 COMENTÁRIOS */
.comments {
  position: absolute;
  bottom: 80px;
  left: 10px;
  width: 70%;
}

.comment {
  background: rgba(0,0,0,0.5);
  padding: 6px 10px;
  border-radius: 12px;
  margin-top: 6px;
  color: white;
  animation: subir 6s linear forwards;
}

.comment strong {
  color: #00ffcc;
}

@keyframes subir {
  0% { transform: translateY(20px); opacity: 1; }
  100% { transform: translateY(-120px); opacity: 0; }
}

/* INPUT */
.chat-input {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

.chat-input button {
  padding: 10px 15px;
  border-radius: 20px;
  background: #ff2d2d;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div id="videoGrid"></div>

<div class="ui">

  <div class="side-actions">

    <div class="action">
      <button id="likeBtn">❤️</button>
      <span id="likeCount">0</span>
    </div>

    <div class="action">
      <button id="joinBtn">🙋</button>
      <span>Participar</span>
    </div>

    <div class="action">
      <button id="approveBtn" style="display:none;">➕</button>
      <span>Convidar</span>
    </div>

  </div>

  <div class="hearts" id="hearts"></div>

  <div class="comments" id="comments"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Comente..." />
    <button id="send">Enviar</button>
  </div>

</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let room;
let ws;
let pendingRequests = [];

const videoGrid = document.getElementById('videoGrid');
const videos = {};

function updateLayout() {
  const total = Object.keys(videos).length;
  videoGrid.style.gridTemplateColumns = total <= 1 ? "1fr" : "1fr 1fr";
}

function addVideo(id, stream, isLocal = false) {
  if (videos[id]) return;

  const box = document.createElement('div');
  box.className = 'video-box';

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  if (isLocal) video.muted = true;

  box.appendChild(video);
  videoGrid.appendChild(box);

  videos[id] = box;

  video.play().catch(()=>{});
  updateLayout();
}

/* ❤️ CORAÇÃO SUBINDO */
function spawnHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '❤️';

  heart.style.left = Math.random() * 20 + 'px';

  document.getElementById('hearts').appendChild(heart);

  setTimeout(() => heart.remove(), 2000);
}

/* 💬 COMENTÁRIO */
function addComment(user, text) {
  const el = document.createElement('div');
  el.className = 'comment';
  el.innerHTML = `<strong>${user}</strong>: ${text}`;
  comments.appendChild(el);

  setTimeout(() => el.remove(), 6000);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "/login.html";

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room');
  const role = params.get('role') || 'audience';

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'join',
      room: roomName,
      userId: user.uid,
      username: user.email,
      role
    }));
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === 'message') {
      addComment(msg.username, msg.text);
    }

    if (msg.type === 'like-update') {
      likeCount.textContent = msg.likes;
      spawnHeart();
    }

    if (msg.type === 'join-request' && role === 'host') {
      pendingRequests.push(msg.userId);
      alert("Pedido para entrar");
    }

    if (msg.type === 'approved' && msg.userId === user.uid) {
      startPublishing();
    }
  };

  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
  const data = await res.json();

  room = new Room();
  await room.connect(data.url, data.token);

  room.participants.forEach((participant) => {
    participant.tracks.forEach(pub => {
      if (pub.isSubscribed && pub.track) {
        handleTrack(pub.track, participant);
      }
    });
  });

  room.on('trackSubscribed', (track, pub, participant) => {
    handleTrack(track, participant);
  });

  function handleTrack(track, participant) {
    if (track.kind === 'video') {
      const stream = new MediaStream([track.mediaStreamTrack]);
      addVideo(participant.identity, stream);
    }

    if (track.kind === 'audio') {
      const audio = document.createElement('audio');
      audio.srcObject = new MediaStream([track.mediaStreamTrack]);
      audio.autoplay = true;
      audio.play().catch(()=>{});
    }
  }

  if (role === 'host') {
    approveBtn.style.display = 'block';
    await startPublishing();
  }

  async function startPublishing() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    addVideo("self", stream, true);

    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }
  }

  likeBtn.onclick = () => {
    ws.send(JSON.stringify({ type: 'like' }));

    spawnHeart();
  };

  send.onclick = () => {
    if (!msg.value) return;

    ws.send(JSON.stringify({
      type: 'message',
      text: msg.value
    }));

    msg.value = '';
  };

  joinBtn.onclick = () => {
    ws.send(JSON.stringify({ type: 'join-request', userId: user.uid }));
  };

  approveBtn.onclick = () => {
    const userId = pendingRequests.shift();
    if (!userId) return;

    ws.send(JSON.stringify({
      type: 'approve-user',
      userId
    }));
  };

});
</script>

</body>
</html>
