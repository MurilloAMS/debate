<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<link rel="icon" href="data:,">

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

/* 🔥 GRID TIKTOK */
#videoGrid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: grid;
}

/* 📺 VIDEO */
.video-box {
  width: 100%;
  height: 100%;
  position: relative;
}

.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🔥 LATERAL */
.side-actions {
  position: fixed;
  right: 10px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  z-index: 10;
}

.action {
  text-align: center;
  color: white;
}

.action button {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  color: white;
  font-size: 20px;
}

/* 💬 COMENTÁRIOS */
.comments {
  position: fixed;
  bottom: 80px;
  left: 10px;
  width: 70%;
}

.comment {
  background: rgba(0,0,0,0.4);
  padding: 6px 10px;
  border-radius: 10px;
  margin-top: 5px;
  animation: subir 6s linear forwards;
  color: white;
}

@keyframes subir {
  0% { transform: translateY(20px); }
  100% { transform: translateY(-120px); opacity: 0; }
}

/* INPUT */
.chat-input {
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

.chat-input button {
  padding: 10px;
  border-radius: 20px;
  background: red;
  border: none;
  color: white;
}
</style>
</head>

<body>

<!-- 🔥 GRID -->
<div id="videoGrid"></div>

<!-- 🔥 LATERAL -->
<div class="side-actions">
  <div class="action">
    <button id="likeBtn">❤️</button>
    <div id="likeCount">0</div>
  </div>

  <div class="action">
    <button id="joinBtn">🙋</button>
  </div>

  <div class="action" id="hostControls" style="display:none;">
    <button id="approveBtn">➕</button>
  </div>
</div>

<!-- 💬 -->
<div class="comments" id="comments"></div>

<div class="chat-input">
  <input id="msg" placeholder="Comente..." />
  <button id="send">Enviar</button>
</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let ws;
let room;
let pendingRequests = [];

const videoGrid = document.getElementById('videoGrid');
const videos = {}; // 🔥 controla todos os vídeos

// ===================== GRID DINÂMICO =====================
function updateLayout() {
  const total = Object.keys(videos).length;

  if (total === 1) {
    videoGrid.style.gridTemplateColumns = "1fr";
  } else if (total === 2) {
    videoGrid.style.gridTemplateColumns = "1fr 1fr";
  } else {
    videoGrid.style.gridTemplateColumns = "1fr 1fr";
  }
}

// ===================== ADD VIDEO =====================
function addVideo(id, track) {
  if (videos[id]) return;

  const box = document.createElement('div');
  box.className = 'video-box';

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;

  const stream = new MediaStream([track.mediaStreamTrack]);
  video.srcObject = stream;

  box.appendChild(video);
  videoGrid.appendChild(box);

  videos[id] = box;

  updateLayout();
}

// ===================== REMOVE VIDEO =====================
function removeVideo(id) {
  if (!videos[id]) return;

  videos[id].remove();
  delete videos[id];

  updateLayout();
}

// ===================== COMMENTS =====================
function addComment(text) {
  const el = document.createElement('div');
  el.className = 'comment';
  el.textContent = text;
  document.getElementById('comments').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

// ===================== INIT =====================
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "/login.html";

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room');
  const role = params.get('role') || 'audience';

  // 🔥 WS
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'join',
      room: roomName,
      userId: user.uid,
      username: user.email,
      role
    }));
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === 'message') addComment(`${msg.username}: ${msg.text}`);
    if (msg.type === 'like-update') document.getElementById('likeCount').textContent = msg.likes;

    if (msg.type === 'join-request' && role === 'host') {
      pendingRequests.push(msg.userId);
      alert("Pedido de participação");
    }

    if (msg.type === 'approved' && msg.userId === user.uid) {
      startPublishing();
    }
  };

  // 🔥 LIVEKIT
  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
  const data = await res.json();

  room = new Room();
  await room.connect(data.url, data.token);

  // 📡 RECEBER
  room.on('trackSubscribed', (track, pub, participant) => {
    if (track.kind === 'video') {
      addVideo(participant.identity, track);
    }
  });

  room.on('participantDisconnected', (p) => {
    removeVideo(p.identity);
  });

  // 👑 HOST
  if (role === 'host') {
    document.getElementById('hostControls').style.display = 'block';
    await startPublishing();
  }

  // 🎥 PUBLICAR
  async function startPublishing() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }
  }

  // 🙋
  document.getElementById('joinBtn').onclick = () => {
    ws.send(JSON.stringify({ type: 'join-request', userId: user.uid }));
  };

  // 👑
  document.getElementById('approveBtn').onclick = () => {
    const userId = pendingRequests.shift();
    if (!userId) return alert("Sem pedidos");

    ws.send(JSON.stringify({
      type: 'approve-user',
      userId
    }));
  };

  // 💬
  document.getElementById('send').onclick = () => {
    const input = document.getElementById('msg');
    if (!input.value) return;

    ws.send(JSON.stringify({
      type: 'message',
      text: input.value
    }));

    input.value = '';
  };

  // ❤️
  document.getElementById('likeBtn').onclick = () => {
    ws.send(JSON.stringify({ type: 'like' }));
  };

});
</script>

</body>
</html>
