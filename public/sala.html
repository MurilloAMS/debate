<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial;
      color: white;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      background: black;
      text-align: center;
      z-index: 10;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: 50vh;
      object-fit: cover;
      background: black;
    }
  </style>
</head>

<body>

<div class="top-bar">
  🔴 AO VIVO
</div>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script type="module">

import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Você precisa estar logado");
    location.href = "/login.html";
    return;
  }

  try {
    const params = new URLSearchParams(window.location.search);
    const roomName = params.get('room') || 'sala1';

    console.log("🔵 Entrando na sala:", roomName);

    // ===================== 🔥 BUSCAR TOKEN CORRETAMENTE =====================
    const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
    const data = await res.json();

    console.log("🔍 RESPOSTA TOKEN:", data);

    // 🚨 VALIDAÇÃO FORTE
    if (!data.token || typeof data.token !== 'string') {
      throw new Error("Token inválido ou não é string");
    }

    if (!data.url) {
      throw new Error("URL do LiveKit inválida");
    }

    // ===================== 🚀 CONECTAR =====================
    const room = new Room();

    await room.connect(data.url, data.token);

    console.log("✅ Conectado ao LiveKit!");

    // ===================== 🎥 CAPTURA LOCAL =====================
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    document.getElementById('localVideo').srcObject = stream;

    // ===================== 🚀 PUBLICAR =====================
    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }

    console.log("🎥 Câmera e áudio publicados");

    // ===================== 👥 RECEBER OUTROS =====================
    room.on('trackSubscribed', (track) => {
      console.log("📡 Recebendo track:", track.kind);

      if (track.kind === 'video') {
        const mediaStream = new MediaStream([track.mediaStreamTrack]);
        document.getElementById('remoteVideo').srcObject = mediaStream;
      }
    });

    // ===================== 🔄 DEBUG EXTRA =====================
    room.on('participantConnected', (p) => {
      console.log("👤 Participante entrou:", p.identity);
    });

    room.on('participantDisconnected', (p) => {
      console.log("❌ Participante saiu:", p.identity);
    });

  } catch (err) {
    console.error("❌ ERRO REAL:", err);
    alert("Erro ao conectar na live: " + err.message);
  }
});

</script>

</body>
</html>
