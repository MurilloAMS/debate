<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <!-- 🔥 REMOVE ERRO DO FAVICON -->
  <link rel="icon" href="data:,">

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial;
      color: white;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      background: black;
      text-align: center;
      z-index: 10;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: 50vh;
      object-fit: cover;
      background: black;
    }

    .click-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
    }

    .click-overlay span {
      background: red;
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="top-bar">
  🔴 AO VIVO
</div>

<!-- 🔥 OVERLAY PARA LIBERAR ÁUDIO -->
<div class="click-overlay" id="overlay">
  <span>Toque para entrar na live</span>
</div>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script type="module">

import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let room;

// 🔥 LIBERA ÁUDIO COM CLIQUE (resolve erro do Chrome)
document.getElementById('overlay').onclick = async () => {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();
  } catch {}

  document.getElementById('overlay').style.display = 'none';
};

// ===================== LOGIN =====================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Você precisa estar logado");
    location.href = "/login.html";
    return;
  }

  try {
    const params = new URLSearchParams(window.location.search);
    const roomName = params.get('room') || 'sala1';

    console.log("🔵 Entrando na sala:", roomName);

    // ===================== 🔥 TOKEN =====================
    const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);

    if (!res.ok) {
      throw new Error("Erro ao buscar token");
    }

    const data = await res.json();

    console.log("🔍 TOKEN OK");

    if (!data.token || typeof data.token !== 'string') {
      throw new Error("Token inválido");
    }

    if (!data.url) {
      throw new Error("URL inválida");
    }

    // ===================== 🚀 CONEXÃO =====================
    room = new Room();

    await room.connect(data.url, data.token);

    console.log("✅ Conectado ao LiveKit!");

    // ===================== 🎥 CÂMERA =====================
    let stream;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

      document.getElementById('localVideo').srcObject = stream;

    } catch (err) {
      console.error("❌ ERRO NA CÂMERA:", err);
      alert("Erro ao acessar câmera/microfone");
      return;
    }

    // ===================== 🚀 PUBLICAR =====================
    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }

    console.log("🎥 Publicado");

    // ===================== 👥 RECEBER =====================
    room.on('trackSubscribed', (track) => {
      if (track.kind === 'video') {
        const mediaStream = new MediaStream([track.mediaStreamTrack]);
        document.getElementById('remoteVideo').srcObject = mediaStream;
      }
    });

    // ===================== DEBUG =====================
    room.on('participantConnected', (p) => {
      console.log("👤 Entrou:", p.identity);
    });

    room.on('participantDisconnected', (p) => {
      console.log("❌ Saiu:", p.identity);
    });

  } catch (err) {
    console.error("❌ ERRO:", err);
    alert("Erro ao conectar: " + err.message);
  }
});

</script>

</body>
</html>
