<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Live</title>

<style>
body { margin:0; background:black; font-family:Arial; overflow:hidden; }

#videoGrid {
  position: fixed;
  inset: 0;
  display: grid;
}

.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ui {
  position: fixed;
  inset: 0;
  z-index: 10;
}

.side-actions {
  position: absolute;
  right: 12px;
  bottom: 110px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
}

.action button {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 24px;
}

.chat-input {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 80px;
  display: flex;
  gap: 10px;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

.chat-input button {
  background: red;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div id="videoGrid"></div>

<div class="ui">

  <div class="side-actions">
    <button id="likeBtn">❤️</button>
    <span id="likeCount">0</span>

    <button id="joinBtn">🙋</button>
    <button id="approveBtn" style="display:none;">➕</button>
  </div>

  <div class="chat-input">
    <input id="msg" placeholder="Comente..." />
    <button id="send">Enviar</button>
  </div>

</div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let room;
let ws;
let pendingRequests = [];

const videoGrid = document.getElementById('videoGrid');
const videos = {};

function addVideo(id, stream, isLocal = false) {
  if (videos[id]) return;

  const box = document.createElement('div');
  const video = document.createElement('video');

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  if (isLocal) video.muted = true;

  box.appendChild(video);
  videoGrid.appendChild(box);

  videos[id] = true;

  video.play().catch(()=>{});
}

function handleTrack(track, participant, user) {

  if (track.kind === 'video') {
    const stream = new MediaStream([track.mediaStreamTrack]);
    addVideo(participant.identity + track.sid, stream);
  }

  if (track.kind === 'audio') {
    const audio = document.createElement('audio');
    audio.srcObject = new MediaStream([track.mediaStreamTrack]);
    audio.autoplay = true;

    // 🔥 evita eco
    if (participant.identity === user.uid) {
      audio.muted = true;
    }

    audio.play().catch(()=>{});
  }
}

onAuthStateChanged(auth, async (user) => {

  if (!user) return location.href = "/login.html";

  const params = new URLSearchParams(location.search);
  const roomName = params.get('room');
  const role = params.get('role') || 'audience';

  // ================= WS =================
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'join',
      room: roomName,
      userId: user.uid,
      username: user.uid,
      role
    }));
  };

  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }

    if (data.type === 'like-update') {
      document.getElementById('likeCount').textContent = data.likes;
    }

    if (data.type === 'approved' && data.userId === user.uid) {
      startPublishing();
    }
  };

  // ================= LIVEKIT =================
  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}&role=${role}`);
  const tk = await res.json();

  room = new Room();

  await room.connect(tk.url, tk.token);

  console.log("🔥 conectado como:", role);

  // 🔥 TRACKS NOVOS
  room.on('trackSubscribed', (track, pub, participant) => {
    handleTrack(track, participant, user);
  });

  // 🔥 TRACKS EXISTENTES (CORRIGIDO)
  room.remoteParticipants.forEach(participant => {

    participant.trackPublications.forEach(pub => {
      if (pub.track) {
        handleTrack(pub.track, participant, user);
      }
    });

  });

  // ================= HOST =================
  if (role === 'host') {
    document.getElementById('approveBtn').style.display = 'block';
    await startPublishing();
  }

  // ================= PUBLICAR =================
  async function startPublishing() {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    addVideo("self", stream, true);

    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }

    console.log("🎥 transmissão OK");
  }

  // ================= BOTÕES =================
  document.getElementById('likeBtn').onclick = () => {
    ws.send(JSON.stringify({ type: 'like' }));
  };

  document.getElementById('send').onclick = () => {
    const input = document.getElementById('msg');
    if (!input.value) return;

    ws.send(JSON.stringify({
      type: 'message',
      text: input.value
    }));

    input.value = '';
  };

});

// 🔥 CORRIGE ERRO DO AUDIO (IMPORTANTE)
document.body.addEventListener('click', () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
}, { once: true });

</script>

</body>
</html>
