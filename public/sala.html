<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE — Ao Vivo</title>

  <!-- 🔥 LIVEKIT -->
  <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial, sans-serif;
      color: white;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      background: black;
      z-index: 10;
      text-align: center;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: 50vh;
      object-fit: cover;
      background: black;
    }
  </style>
</head>

<body>

<div class="top-bar">
  🔴 AO VIVO
</div>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script type="module">
import { auth, onAuthStateChanged } from '/firebase.js';

let roomInstance;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = '/login.html';
    return;
  }

  try {
    const params = new URLSearchParams(location.search);
    const roomName = params.get('room') || 'sala1';

    // 🔥 PEGA TOKEN DO SERVIDOR
    const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);

    if (!res.ok) {
      throw new Error("Erro ao buscar token");
    }

    const data = await res.json();

    if (!data.token || !data.url) {
      throw new Error("Token inválido");
    }

    // 🔥 CRIA SALA
    const room = new LiveKit.Room();

    await room.connect(data.url, data.token);
    roomInstance = room;

    console.log("✅ Conectado ao LiveKit");

    // 🔥 SUA CÂMERA
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    const localVideo = document.getElementById('localVideo');
    localVideo.srcObject = stream;

    // 🔥 ENVIA SUA CÂMERA
    for (const track of stream.getTracks()) {
      await room.localParticipant.publishTrack(track);
    }

    // 🔥 RECEBE OUTROS PARTICIPANTES
    room.on('trackSubscribed', (track) => {
      if (track.kind === 'video') {
        const remoteVideo = document.getElementById('remoteVideo');
        const mediaStream = new MediaStream([track.mediaStreamTrack]);
        remoteVideo.srcObject = mediaStream;
      }
    });

  } catch (err) {
    console.error("❌ ERRO:", err);
    alert("Erro ao conectar na live");
  }
});
</script>

</body>
</html>
