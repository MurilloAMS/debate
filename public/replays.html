<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Replays</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial;
    }

    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .item {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 80px;
      left: 15px;
      color: white;
    }

    .like-btn {
      position: absolute;
      right: 20px;
      bottom: 120px;
      background: rgba(255,0,0,0.8);
      border: none;
      padding: 10px;
      border-radius: 50%;
      color: white;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="feed" id="feed"></div>

<script src="replays.js"></script>

</body>
</html>
