<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEBATE — Feed</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

.feed {
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.live {
  height: 100vh;
  position: relative;
  scroll-snap-align: start;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🔥 OVERLAY INFO */
.info {
  position: absolute;
  bottom: 80px;
  left: 10px;
  color: white;
  z-index: 10;
}

/* 🔥 LATERAL */
.side {
  position: absolute;
  right: 10px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  z-index: 10;
}

.btn {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 20px;
}

/* ❤️ ANIMAÇÃO LIKE */
.heart {
  position: absolute;
  bottom: 120px;
  right: 40px;
  color: red;
  font-size: 24px;
  animation: subir 1.5s linear forwards;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-150px); opacity: 0; }
}
</style>
</head>

<body>

<div class="feed" id="feed"></div>

<script type="module">
import { Room } from 'https://esm.sh/livekit-client';
import { auth, onAuthStateChanged } from '/firebase.js';

let currentRooms = {};
let preloadedRooms = {};

const feed = document.getElementById('feed');

// ================= LOGIN =================
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "login.html";
  loadLives(user);
});

// ================= LOAD =================
async function loadLives(user) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'get-rooms' }));
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'rooms-list') {
      render(msg.rooms, user);
    }
  };
}

// ================= RENDER =================
function render(rooms, user) {
  feed.innerHTML = '';

  rooms.forEach((room, index) => {
    const div = document.createElement('div');
    div.className = 'live';
    div.dataset.room = room.room;
    div.dataset.index = index;

    div.innerHTML = `
      <video muted playsinline></video>

      <div class="info">
        <strong>${room.host || "Usuário"}</strong><br>
        👥 ${room.count}
      </div>

      <div class="side">
        <button class="btn like">❤️</button>
        <button class="btn">💬</button>
        <button class="btn share">🔗</button>
      </div>
    `;

    // ❤️ LIKE ANIMAÇÃO
    div.querySelector('.like').onclick = () => {
      spawnHeart(div);
    };

    // 🔗 SHARE
    div.querySelector('.share').onclick = () => {
      navigator.clipboard.writeText(window.location.origin + "/sala.html?room=" + room.room);
      alert("Link copiado!");
    };

    feed.appendChild(div);
  });

  initObserver(user);
}

// ================= OBSERVER =================
function initObserver(user) {
  const items = document.querySelectorAll('.live');

  const observer = new IntersectionObserver(async (entries) => {
    for (const entry of entries) {
      const el = entry.target;
      const roomName = el.dataset.room;
      const index = Number(el.dataset.index);

      if (entry.isIntersecting) {
        await startLive(el, roomName, user);

        // 🔥 PRELOAD PRÓXIMA
        const next = document.querySelector(`[data-index="${index+1}"]`);
        if (next) preload(next.dataset.room, user);

      } else {
        stopLive(roomName);
      }
    }
  }, { threshold: 0.7 });

  items.forEach(i => observer.observe(i));
}

// ================= START =================
async function startLive(container, roomName, user) {
  if (currentRooms[roomName]) return;

  let room = preloadedRooms[roomName];

  if (!room) {
    const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
    const data = await res.json();

    room = new Room();
    await room.connect(data.url, data.token);
  }

  currentRooms[roomName] = room;

  const video = container.querySelector('video');
  observer.observe(video);

  room.on('trackSubscribed', (track) => {
    if (track.kind === 'video') {
      const stream = new MediaStream([track.mediaStreamTrack]);
      video.srcObject = stream;
    }
  });
}

// ================= PRELOAD =================
async function preload(roomName, user) {
  if (preloadedRooms[roomName] || currentRooms[roomName]) return;

  const res = await fetch(`/get-token?room=${roomName}&username=${user.uid}`);
  const data = await res.json();

  const room = new Room();
  await room.connect(data.url, data.token);

  preloadedRooms[roomName] = room;
}

// ================= STOP =================
function stopLive(roomName) {
  const room = currentRooms[roomName];

  if (room) {
    room.disconnect();
    delete currentRooms[roomName];
  }
}

// ================= ❤️ ANIMAÇÃO =================
function spawnHeart(container) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerHTML = '❤️';

  container.appendChild(heart);

  setTimeout(() => heart.remove(), 1500);
}
</script>

</body>
</html>
