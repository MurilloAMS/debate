<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* 🔥 TOPO */
    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,0,0.8);
      box-sizing: border-box;
    }

    .logo {
      color: red;
      font-weight: bold;
      font-size: 20px;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 50%;
    }

    #username {
      font-size: 14px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logoutBtn {
      background: red;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    /* 🔥 CATEGORIAS */
    .categories {
      position: fixed;
      top: 50px;
      width: 100%;
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
      background: rgba(0,0,0,0.9);
      z-index: 999;
    }

    .categories span {
      background: #222;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 13px;
    }

    /* 🔥 FEED TIKTOK */
    .feed {
      position: absolute;
      top: 100px;
      bottom: 0;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-container {
      height: calc(100vh - 100px);
      position: relative;
      scroll-snap-align: start;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    /* 🔥 INFO SOBRE O VIDEO */
    .overlay {
      position: absolute;
      bottom: 80px;
      left: 15px;
      color: white;
      z-index: 2;
    }

    /* 🔥 BOTÃO LIVE */
    #startLiveBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: red;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 30px;
      font-weight: bold;
      z-index: 1000;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- 🔥 TOPO -->
<div class="top-bar">
  <div class="logo">DEBATE</div>

  <div class="right">
    <span id="username"></span>
    🔔
    <button id="logoutBtn">Sair</button>
  </div>
</div>

<!-- 🔥 CATEGORIAS -->
<div class="categories">
  <span>🔥 Em alta</span>
  <span>🎮 Games</span>
  <span>🗣 Política</span>
  <span>📈 Negócios</span>
</div>

<!-- 🔥 FEED -->
<div class="feed" id="feed"></div>

<!-- 🔥 BOTÃO -->
<button id="startLiveBtn">+ Iniciar Debate</button>

<!-- 🔥 AUTH -->
<script type="module">
import { auth, onAuthStateChanged, signOut, db } from '/firebase.js';
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username = document.getElementById('username');
const logoutBtn = document.getElementById('logoutBtn');

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = 'login.html';
    return;
  }

  try {
    const snap = await getDoc(doc(db, "usuarios", user.uid));

    if (snap.exists()) {
      username.textContent = snap.data().nome || "Usuário";
    } else {
      username.textContent = user.email.split('@')[0];
    }

  } catch {
    username.textContent = user.email.split('@')[0];
  }
});

// 🔥 LOGOUT
logoutBtn.onclick = async () => {
  await signOut(auth);
  location.href = 'login.html';
};
</script>

<!-- 🔥 FEED (TIKTOK) -->
<script type="module" src="/home.js"></script>

<!-- 🔥 CRIAR LIVE -->
<script>
document.getElementById('startLiveBtn').onclick = () => {
  const room = prompt('Nome da sua live:');
  if (!room) return;

  location.href = `/sala.html?room=${room}&role=host`;
};
</script>

</body>
</html>
