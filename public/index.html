<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 50px;
      z-index: 1000;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: rgba(0,0,0,0.9);
      box-sizing: border-box;
    }

    .logo {
      color: red;
      font-weight: bold;
      font-size: 18px;
    }

    .search-box {
      flex: 1;
      margin: 0 10px;
    }

    .search-box input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 20px;
      border: none;
      background: #222;
      color: white;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid red;
      object-fit: cover;
      cursor: pointer;
    }

    .bell {
      font-size: 16px;
      cursor: pointer;
    }

    #logoutBtn {
      background: red;
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    .categories {
      position: fixed;
      top: 50px;
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      overflow-x: auto;
      background: rgba(0,0,0,0.95);
      z-index: 999;
    }

    .categories span {
      background: #222;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 12px;
    }

    .feed {
      position: fixed;
      top: 100px;
      bottom: 0;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-container {
      height: calc(100vh - 100px);
      position: relative;
      scroll-snap-align: start;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .overlay {
      position: absolute;
      bottom: 80px;
      left: 15px;
      color: white;
      z-index: 2;
      text-shadow: 0 0 5px black;
    }

    #startLiveBtn {
      position: fixed;
      bottom: 20px;
      left: 15px;
      background: red;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: bold;
      z-index: 1000;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="top-bar">
  <div class="logo">DEBATE</div>

  <div class="search-box">
    <input id="searchInput" placeholder="Buscar debates..." />
  </div>

  <div class="right">
    <span class="bell">🔔</span>
    <img id="profileBtn" class="profile-btn" src="https://via.placeholder.com/40" />
    <button id="logoutBtn">Sair</button>
  </div>
</div>

<div class="categories">
  <span>🔥 Em alta</span>
  <span>🎮 Games</span>
  <span>🗣 Política</span>
  <span>📈 Negócios</span>
</div>

<div class="feed" id="feed"></div>

<button id="startLiveBtn">+ Live</button>

<!-- 🔥 AUTH + PERFIL -->
<script type="module">
import { auth, onAuthStateChanged, signOut, db } from '/firebase.js';
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const logoutBtn = document.getElementById('logoutBtn');
const profileBtn = document.getElementById('profileBtn');

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = 'login.html';
    return;
  }

  try {
    const snap = await getDoc(doc(db, "usuarios", user.uid));

    if (snap.exists()) {
      const data = snap.data();

      if (data.foto) {
        profileBtn.src = data.foto;
      }
    }

  } catch (err) {
    console.log("Erro ao carregar perfil");
  }
});

logoutBtn.onclick = async () => {
  await signOut(auth);
  location.href = 'login.html';
};

// 👉 abrir perfil
profileBtn.onclick = () => {
  location.href = `/perfil.html?uid=${auth.currentUser.uid}`;
};
</script>

<script type="module" src="/home.js"></script>

<script>
document.getElementById('startLiveBtn').onclick = () => {

  const room = prompt('Nome da live:');
  if (!room) return;

  const topic = prompt('Assunto da live:');
  if (!topic) return;

  location.href = `/sala.html?room=${room}&role=host&topic=${topic}`;
};
</script>

</body>
</html>
