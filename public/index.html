<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      color: white;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: red;
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-box img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid red;
    }

    #userInfo {
      font-size: 13px;
    }

    #logoutBtn {
      background: red;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .categories {
      position: fixed;
      top: 50px;
      width: 100%;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }

    .categories button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .categories button.active {
      background: red;
    }

    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .feed-item {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
    }

    .feed-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 80px;
      left: 15px;
      color: white;
    }

    .live-badge {
      position: absolute;
      top: 80px;
      left: 15px;
      background: red;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 5px;
      color: white;
    }

    .enter-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: red;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- TOPO -->
  <div class="top-bar">
    <div class="logo">DEBATE</div>

    <div class="user-box">

      <!-- 🔔 SININHO -->
      <div class="notification-wrapper" id="notificationIcon">
        <img src="/icons8-bell-50.png" />
        <div class="notification-count" id="notificationCounter" style="display:none;">0</div>
      </div>

      <!-- LISTA -->
      <ul id="notificationList" style="
        display:none;
        position:absolute;
        right:10px;
        top:50px;
        background:#111;
        padding:10px;
        border-radius:10px;
        list-style:none;
        width:200px;
        max-height:300px;
        overflow-y:auto;
        z-index:999;
      "></ul>

      <img id="userPhoto" src="" style="display:none;" />
      <span id="userInfo"></span>
      <button id="logoutBtn">Sair</button>

    </div>
  </div>

  <!-- CATEGORIAS -->
  <div class="categories">
    <button data-cat="all" class="active">Todos</button>
    <button data-cat="politica">Política</button>
    <button data-cat="religiao">Religião</button>
    <button data-cat="futebol">Futebol</button>
    <button data-cat="tecnologia">Tecnologia</button>
    <button data-cat="familia">Família</button>
    <button data-cat="economia">Economia</button>
  </div>

  <!-- FEED -->
  <main class="feed" id="feed"></main>

  <!-- 🔥 AUTH -->
  <script type="module">
    import { auth, onAuthStateChanged, signOut } from '/firebase.js';

    const userInfo = document.getElementById('userInfo');
    const logoutBtn = document.getElementById('logoutBtn');
    const userPhoto = document.getElementById('userPhoto');

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        userInfo.textContent = user.displayName || user.email;

        if (user.photoURL) {
          userPhoto.src = user.photoURL;
          userPhoto.style.display = 'block';
        }
      }
    });

    logoutBtn.onclick = async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    };
  </script>

  <!-- FEED -->
  <script src="/home.js"></script>

</body>
</html>
