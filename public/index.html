<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      color: white;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: red;
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-box img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid red;
    }

    #logoutBtn {
      background: red;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .feed-item {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
    }

    .feed-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .overlay {
      position: absolute;
      bottom: 80px;
      left: 15px;
      color: white;
      z-index: 2;
    }

    .enter-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: red;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 2;
    }

    #startLiveBtn {
      position: fixed;
      bottom: 80px;
      left: 20px;
      background: red;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 30px;
      font-weight: bold;
      z-index: 999;
    }
  </style>
</head>

<body>

<!-- TOPO -->
<div class="top-bar">
  <div class="logo">DEBATE</div>

  <div class="user-box">
    <span id="userInfo"></span>
    <button id="logoutBtn">Sair</button>
  </div>
</div>

<!-- FEED -->
<main class="feed" id="feed"></main>

<!-- BOTÃO LIVE -->
<button id="startLiveBtn">+ Iniciar Debate</button>

<!-- 🔥 AUTH -->
<script type="module">
import { auth, onAuthStateChanged, signOut, db } from '/firebase.js';
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const userInfo = document.getElementById('userInfo');
const logoutBtn = document.getElementById('logoutBtn');

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = 'login.html';
    return;
  }

  try {
    const snap = await getDoc(doc(db, "usuarios", user.uid));

    if (snap.exists()) {
      userInfo.textContent = snap.data().nome;
    } else {
      userInfo.textContent = user.email;
    }

  } catch {
    userInfo.textContent = user.email;
  }
});

// 🔥 LOGOUT
logoutBtn.onclick = async () => {
  await signOut(auth);
  location.href = 'login.html';
};
</script>

<!-- 🔥 FEED (LIVEKIT) -->
<script type="module" src="/home.js"></script>

<!-- 🔥 CRIAR LIVE -->
<script>
document.getElementById('startLiveBtn').onclick = () => {
  const room = prompt('Nome da sua live:');

  if (!room) return;

  location.href = `/sala.html?room=${room}&role=host`;
};
</script>

</body>
</html>
