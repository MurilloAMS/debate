<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBATE</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* TOPO */
    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,0,0.8);
    }

    .logo {
      color: red;
      font-weight: bold;
      font-size: 20px;
    }

    /* CATEGORIAS */
    .categories {
      margin-top: 60px;
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
      background: #111;
    }

    .categories span {
      background: #222;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* FEED */
    .feed {
      margin-top: 10px;
      padding: 10px;
    }

    .feed-item {
      background: #111;
      border-radius: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .feed-item video {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .info {
      padding: 10px;
    }

    .enter {
      margin: 10px;
      padding: 8px;
      background: red;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #startLiveBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: red;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- TOPO -->
<div class="top-bar">
  <div class="logo">DEBATE</div>

  <div>
    <span id="username"></span>
    🔔
  </div>
</div>

<!-- CATEGORIAS -->
<div class="categories">
  <span>🔥 Em alta</span>
  <span>🎮 Games</span>
  <span>🗣 Política</span>
  <span>📈 Negócios</span>
</div>

<!-- FEED -->
<div class="feed" id="feed"></div>

<!-- BOTÃO -->
<button id="startLiveBtn">+ Iniciar Debate</button>

<!-- 🔥 AUTH -->
<script type="module">
import { auth, onAuthStateChanged, signOut, db } from '/firebase.js';
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username = document.getElementById('username');

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = 'login.html';
    return;
  }

  try {
    const snap = await getDoc(doc(db, "usuarios", user.uid));

    if (snap.exists()) {
      username.textContent = snap.data().nome;
    } else {
      username.textContent = user.email.split('@')[0];
    }

  } catch {
    username.textContent = user.email.split('@')[0];
  }
});
</script>

<!-- 🔥 FEED -->
<script type="module" src="/home.js"></script>

<!-- 🔥 LIVE -->
<script>
document.getElementById('startLiveBtn').onclick = () => {
  const room = prompt('Nome da sua live:');
  if (!room) return;

  location.href = `/sala.html?room=${room}&role=host`;
};
</script>

</body>
</html>
