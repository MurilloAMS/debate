<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Perfil</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  color: white;
  font-family: Arial;
}

/* 🔥 TOPO */
.top-bar {
  position: sticky;
  top: 0;
  background: #0b0f14;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 10;
}

.back {
  font-size: 20px;
  cursor: pointer;
}

/* 🔥 CONTAINER */
.perfil-container {
  max-width: 500px;
  margin: auto;
}

/* 🔥 HEADER */
.header {
  padding: 20px;
  text-align: center;
}

.foto {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 3px solid red;
  object-fit: cover;
  cursor: pointer;
}

.nome {
  font-size: 20px;
  margin-top: 10px;
  font-weight: bold;
}

.bio {
  font-size: 14px;
  color: #aaa;
  margin-top: 5px;
}

/* 🔥 STATS */
.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 20px;
}

.stats div {
  text-align: center;
  cursor: pointer;
}

.stats strong {
  font-size: 18px;
}

/* 🔥 AÇÕES */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  justify-content: center;
}

.btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

.btn-follow {
  background: red;
  color: white;
}

.btn-edit {
  background: #222;
  color: white;
}

/* 🔥 SEÇÕES */
.section {
  padding: 15px;
}

.section h3 {
  margin-bottom: 10px;
}

/* 🔴 LIVE */
.live-card {
  position: relative;
  height: 150px;
  background: #111;
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}

.live-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: red;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
}

/* 🎬 GRID REPLAY */
.videos-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.video-item {
  height: 120px;
  background: black;
  position: relative;
}

/* 🔥 FEED */
.feed-perfil {
  height: 400px;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.feed-item-perfil {
  height: 300px;
  margin-bottom: 12px;
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  scroll-snap-align: start;
}

.feed-item-perfil:active {
  transform: scale(0.97);
}

.feed-item-perfil video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.feed-overlay {
  position: absolute;
  bottom: 10px;
  left: 10px;
  font-size: 14px;
}

.enter-btn-perfil {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: red;
  border: none;
  padding: 6px 12px;
  border-radius: 20px;
  color: white;
}

/* 🔥 INPUT BIO */
.bio-edit {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #111;
  color: white;
}
</style>
</head>

<body>

<!-- 🔥 TOPO -->
<div class="top-bar">
  <span class="back" onclick="history.back()">←</span>
  <span>Perfil</span>
</div>

<div class="perfil-container">

  <!-- 🔥 HEADER -->
  <div class="header">
    <img id="foto" class="foto">
    <input type="file" id="uploadFoto" style="display:none">

    <div id="nome" class="nome"></div>
    <div id="bioView" class="bio"></div>

    <div class="stats">
      <div onclick="abrirSeguidores()">
        <strong id="seguidores">0</strong>
        <p>Seguidores</p>
      </div>
      <div onclick="abrirSeguindo()">
        <strong id="seguindo">0</strong>
        <p>Seguindo</p>
      </div>
    </div>

    <div class="actions">
      <button id="followBtn" class="btn btn-follow"></button>
      <button id="editarBtn" class="btn btn-edit">Editar</button>
    </div>
  </div>

  <!-- 🔥 EDIT -->
  <div class="section" id="editArea" style="display:none;">
    <input id="bio" class="bio-edit" placeholder="Escreva sua bio..." />
    <button id="salvar" class="btn btn-follow">Salvar</button>
  </div>

  <!-- 🔴 LIVE -->
  <div class="section">
    <h3>🔴 Ao vivo</h3>
    <div id="lives"></div>
  </div>

  <!-- 🎬 REPLAYS -->
  <div class="section">
    <h3>🎬 Replays</h3>
    <div id="videosGrid" class="videos-grid"></div>
  </div>

  <!-- 📺 FEED -->
  <div class="section">
    <h3>📺 Feed</h3>
    <div id="feedPerfil" class="feed-perfil"></div>
  </div>

</div>

<script type="module" src="/perfil.js"></script>

</body>
</html>
